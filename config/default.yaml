pipeline:
  working_dir: ./output
  log_level: INFO

ingest:
  fix_encoding: true
  merge_paginated: true

convert:
  mappings_dir: ./mappings
  output_format: turtle
  base_uri: "https://bridgingworlds.io/resource/"

store:
  pod_url: "${SOLID_POD_URL}"
  container_base: /social/
  upload_media: true
  register_type_index: true
  batch_size: 50

export:
  bluesky:
    handle: "${BLUESKY_HANDLE}"
    dry_run: false
    rate_limit_delay: 0.5
    max_text_length: 300
  mastodon:
    generate_activitypub: true
    generate_csv: true
    # Live federation: publish posts to an ActivityPods actor's outbox so
    # Mastodon users can follow them. Media stays hosted on the Solid Pod.
    activitypods:
      base_url: "${ACTIVITYPODS_BASE_URL}"
      username: "${ACTIVITYPODS_USERNAME}"
      dry_run: true                 # flip to false to actually federate
      rate_limit_delay: 1.0         # seconds between outbox POSTs

metrics:
  compute_coverage: true
  compute_overhead: true
  output_format: json
